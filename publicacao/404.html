<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada</title>
<style>
:root{--azul:#0B2545;--vinho:#7A1230;--texto-2:#4B5B73}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#fff;color:var(--azul);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--azul);border-bottom:5px solid var(--vinho);padding:22px 24px;color:#fff;font:700 22px Georgia,serif}
main{flex:1;max-width:640px;margin:0 auto;padding:64px 24px}
.codigo{font:700 72px/1 Georgia,serif;color:var(--vinho);margin:0 0 8px}
h1{font:700 28px Georgia,serif;margin:0 0 10px}
p{color:var(--texto-2);margin:0 0 22px}
a{display:inline-block;background:var(--azul);color:#fff;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:600}
a:hover{background:var(--vinho)}a:focus-visible{outline:3px solid var(--vinho);outline-offset:2px}
</style>
</head>
<body>
<header>Trabalho de Previsão de Demandas</header>
<main>
  <p class="codigo">404</p>
  <h1>Página não encontrada</h1>
  <p>O endereço que você abriu não existe neste site. Volte ao início para ver a previsão de demanda de fretes.</p>
  <a id="inicio" href="/">Voltar ao início →</a>
</main>
<script>
  // em páginas de projeto do GitHub Pages (usuario.github.io/projeto/), o início é /projeto/
  try { var h = location.hostname, seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(h) && seg) document.getElementById('inicio').href = '/' + seg + '/'; } catch (e) {}
</script>
</body>
</html>
